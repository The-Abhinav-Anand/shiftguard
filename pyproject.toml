[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "shiftguard"
version = "0.1.0"
description = "Calibration-shift research engine"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "SHIFTGUARD contributors" }]
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "PyYAML>=6.0.3,<7",
  "psycopg[binary]>=3.2,<4",
  "scikit-learn==1.9.0",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
  "openai>=1.50,<2",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8.4,<9"]

[project.scripts]
shiftguard = "shiftguard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest_tmp"
markers = [
  "live: requires an explicitly enabled external service",
  "postgres: requires a PostgreSQL 16 database",
]

[tool.ruff]
target-version = "py313"
line-length = 100
